<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HealthCare AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-wrapper" style="overflow: hidden; background: url('{{ url_for('static', filename='images/hero.png') }}') no-repeat center center fixed; background-size: cover;">
    <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(5, 5, 16, 0.5) 0%, rgba(2, 2, 5, 0.95) 100%); z-index: -1;"></div>
    <div id="blob1" class="dynamic-blob"></div>
    <div id="blob2" class="dynamic-blob"></div>
    
    <div class="auth-card glass-card reveal active" style="animation: slideUp 1s cubic-bezier(0.2, 0.8, 0.2, 1); border: 1.5px solid var(--glass-border); box-shadow: 0 40px 100px -20px rgba(0,0,0,0.7);">
        <div class="auth-header">
            <a href="{{ url_for('index') }}" style="text-decoration: none; color: inherit;">
                <i class="fas fa-stethoscope" style="filter: drop-shadow(0 0 15px var(--accent-blue)); font-size: 4rem; margin-bottom: 20px;"></i>
                <h1 style="font-family: 'Outfit'; font-weight: 800; font-size: 2.2rem; letter-spacing: -1px;">HealthCare AI</h1>
            </a>
            <p>Welcome back to your health portal</p>
            <div style="margin-top: 15px;">
                <a href="{{ url_for('chat_ui') }}" style="color: var(--accent-blue); text-decoration: none; font-size: 0.85rem; background: rgba(0, 123, 255, 0.1); padding: 5px 15px; border-radius: 20px; border: 1px solid rgba(0, 123, 255, 0.2);"><i class="fas fa-robot"></i> Clinical AI Chat</a>
            </div>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="status-badge status-{{ category }}" style="margin-bottom: 20px; display: block; text-align: center;">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <div style="position: relative;">
                    <i class="fas fa-user-tag" style="position: absolute; left: 18px; top: 16px; color: var(--text-muted);"></i>
                    <input type="text" id="username" name="username" required style="padding-left: 50px;" placeholder="Unique username">
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div style="position: relative;">
                    <i class="fas fa-lock" style="position: absolute; left: 18px; top: 16px; color: var(--text-muted);"></i>
                    <input type="password" id="password" name="password" required style="padding-left: 50px;" placeholder="••••••••">
                    <i class="fas fa-eye" style="position: absolute; right: 18px; top: 16px; color: var(--text-muted); cursor: pointer;" onclick="togglePassword()"></i>
                </div>
            </div>
            <button type="submit" class="btn-premium">Sign In <i class="fas fa-sign-in-alt"></i></button>
        </form>

        <div style="margin-top: 30px; text-align: center; color: var(--text-muted); font-size: 0.9rem;">
            <p>New to HealthCare AI?</p>
            <div style="display: flex; gap: 15px; justify-content: center; margin-top: 10px;">
                <a href="{{ url_for('register_patient') }}" style="color: var(--accent-blue); text-decoration: none; font-weight: 600;"><i class="fas fa-user-plus"></i> Patient</a>
                <span style="opacity: 0.3;">|</span>
                <a href="{{ url_for('register_hospital') }}" style="color: var(--accent-purple); text-decoration: none; font-weight: 600;"><i class="fas fa-hospital"></i> Hospital</a>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const pw = document.getElementById('password');
            pw.type = pw.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
