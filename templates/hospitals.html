<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Clinical Visit | HealthCare AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="padding: 40px;">
    <div class="emergency-strip" style="margin-bottom: 30px; border-radius: 15px;">
        <i class="fas fa-exclamation-triangle"></i> EMERGENCY: CALL 108 OR 112
    </div>

    <div style="max-width: 1000px; margin: 0 auto;">
        <div style="margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center;">
            <a href="{{ url_for('patient_dashboard') }}" style="color: var(--accent-blue); text-decoration: none; font-size: 1rem;"><i class="fas fa-arrow-left"></i> Dashboard</a>
            <h1 style="font-family: 'Outfit';">Clinical Providers</h1>
        </div>

        {% if hospitals %}
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 30px;">
                {% for hospital in hospitals %}
                <div class="glass-card" style="padding: 35px; border-left: 5px solid var(--accent-purple);">
                    <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 25px;">
                        <i class="fas fa-hospital" style="font-size: 2.2rem; color: var(--accent-blue);"></i>
                        <div>
                            <h3 style="font-family: 'Outfit'; font-size: 1.4rem;">{{ hospital.username }}</h3>
                            <p style="font-size: 0.8rem; color: var(--text-muted);"><i class="fas fa-map-marker-alt"></i> Verified Care Center</p>
                        </div>
                    </div>
                    
                    <form action="{{ url_for('book_appointment') }}" method="POST" class="booking-flow" data-hosp-id="{{ hospital.id }}">
                        <input type="hidden" name="hospital_id" value="{{ hospital.id }}">
                        
                        <div class="form-group">
                            <label><i class="fas fa-stethoscope"></i> SELECT SPECIALIZATION</label>
                            <select name="specialization" required class="spec-select" onchange="loadDoctors(this)" style="background: rgba(0,0,0,0.2);">
                                <option value="">Loading specializations...</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label><i class="fas fa-user-md"></i> SELECT DOCTOR</label>
                            <select name="doctor_id" required class="doc-select" disabled onchange="showDoctorDetails(this)">
                                <option value="">Select Specialization First</option>
                            </select>
                        </div>

                        <!-- Doctor Detail Card -->
                        <div class="doctor-profile-card glass-card" style="display: none; margin-bottom: 20px; padding: 15px; background: rgba(255,255,255,0.02); border: 1px dashed var(--glass-border);">
                            <div style="display: flex; gap: 15px; align-items: center;">
                                <img src="" class="prof-img" style="width: 70px; height: 70px; border-radius: 12px; object-fit: cover; display: none;">
                                <div class="prof-placeholder" style="width: 70px; height: 70px; border-radius: 12px; background: rgba(0, 212, 255, 0.1); display: flex; align-items: center; justify-content: center; color: var(--accent-blue); font-size: 1.5rem;">
                                    <i class="fas fa-user-md"></i>
                                </div>
                                <div>
                                    <h4 class="prof-name" style="margin: 0; color: var(--accent-blue);"></h4>
                                    <div class="prof-spec" style="font-size: 0.8rem; color: var(--accent-emerald);"></div>
                                    <div class="prof-shift" style="font-size: 0.75rem; color: var(--text-muted); margin-top: 5px;"></div>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label><i class="fas fa-calendar-alt"></i> VISIT DATE</label>
                            <input type="date" name="date" required class="date-input" disabled min="{{ today_date }}" onchange="loadSlots(this)">
                        </div>

                        <div class="form-group">
                            <label><i class="far fa-clock"></i> AVAILABLE SLOT</label>
                            <select name="time" required class="time-select" disabled>
                                <option value="">Select Date for Slots</option>
                            </select>
                        </div>

                        <button type="submit" class="btn-premium book-btn" disabled style="background: var(--accent-emerald);"><i class="fas fa-check-circle"></i> Book Appointment</button>
                    </form>
                </div>
                {% endfor %}
            </div>
        {% else %}
            <div class="glass-card" style="text-align: center; padding: 100px;">
                <p style="color: var(--text-muted);"><i class="fas fa-search" style="font-size: 3rem; margin-bottom: 20px;"></i> No certified providers available.</p>
            </div>
        {% endif %}
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            $('.booking-flow').each(function() {
                const $form = $(this);
                const hospId = $form.data('hosp-id');
                const $specSel = $form.find('.spec-select');
                
                $.get(`/api/specializations/${hospId}`, function(specs) {
                    $specSel.empty().append('<option value="">Choose Clinical Field</option>');
                    specs.forEach(s => $specSel.append(`<option value="${s}">${s}</option>`));
                });
            });
        });

        var currentDoctors = []; // Store current doctor data globally in the script scope
        
        function loadDoctors(select) {
            const $form = $(select).closest('form');
            const hospId = $form.data('hosp-id');
            const spec = $(select).val();
            const $docSel = $form.find('.doc-select');
            
            $docSel.prop('disabled', true).empty().append('<option value="">Consultants Found...</option>');
            $form.find('.date-input, .time-select, .book-btn').prop('disabled', true);
            $form.find('.doctor-profile-card').hide();

            if (!spec) return;

            $.get(`/api/doctors/${hospId}/${spec}`, function(docs) {
                currentDoctors = docs; 
                $docSel.empty().append('<option value="">Pick a Professional</option>');
                docs.forEach(d => {
                    const icon = d.image_url ? '📷' : '👨‍⚕️';
                    $docSel.append(`<option value="${d.id}">${icon} ${d.name}</option>`);
                });
                $docSel.prop('disabled', false);
            });
        }

        function showDoctorDetails(select) {
            const $form = $(select).closest('form');
            const docId = $(select).val();
            const $profile = $form.find('.doctor-profile-card');
            
            if (!docId) {
                $profile.hide();
                $form.find('.date-input').prop('disabled', true);
                return;
            }

            const doctor = currentDoctors.find(d => d.id == docId);
            if (doctor) {
                $profile.find('.prof-name').text(doctor.name);
                $profile.find('.prof-spec').text(doctor.specialization);
                $profile.find('.prof-shift').html(`<i class="far fa-clock"></i> Daily Availability: ${doctor.shift_start} - ${doctor.shift_end}`);
                
                if (doctor.image_url) {
                    $profile.find('.prof-img').attr('src', doctor.image_url).show();
                    $profile.find('.prof-placeholder').hide();
                } else {
                    $profile.find('.prof-img').hide();
                    $profile.find('.prof-placeholder').show();
                }
                $profile.fadeIn();
                $form.find('.date-input').prop('disabled', false);
            }
        }

        function loadSlots(input) {
            const $form = $(input).closest('form');
            const docId = $form.find('.doc-select').val();
            const dateStr = $(input).val();
            const $timeSel = $form.find('.time-select');
            
            $timeSel.prop('disabled', true).empty().append('<option value="">Syncing Slots...</option>');
            $form.find('.book-btn').prop('disabled', true);

            if (!docId || !dateStr) return;

            $.get(`/api/slots/${docId}/${dateStr}`, function(slots) {
                if (slots.length > 0) {
                    $timeSel.empty().append('<option value="">Select a Timing</option>');
                    slots.forEach(s => $timeSel.append(`<option value="${s}">${s}</option>`));
                    $timeSel.prop('disabled', false);
                    $form.find('.book-btn').prop('disabled', false);
                } else {
                    $timeSel.empty().append('<option value="">No Slots Open</option>');
                }
            });
        }
    </script>
</body>
</html>
